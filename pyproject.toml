[project]
name = "news-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Todorov", email = "danieltodorov541@gmail.com" }
]
requires-python = ">=3.13.9"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
news-agent = "news_agent:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
